<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Color Code Examples</title>
</head>
<body style="background-color: #F4F6F7; font-family: Arial, sans-serif; padding: 20px;">

    <!-- Heading with a deep blue text color -->
    <h1 style="color: #1A5276;">HTML Hex Code Examples</h1>
    <p>This page demonstrates how to use hex codes directly in your HTML tags.</p>

    <hr>

    <!-- Example 1: Text Color (Tomato Orange) -->
    <h3 style="color: #E74C3C;">1. Text Color</h3>
    <p style="color: #E74C3C;">This text is styled using the hex code #E74C3C.</p>

    <!-- Example 2: Background Color (Emerald Green with White Text) -->
    <h3>2. Background Color</h3>
    <div style="background-color: #2ECC71; color: #FFFFFF; padding: 15px; border-radius: 5px;">
        This box has an emerald green background (#2ECC71) and white text (#FFFFFF).
    </div>

    <!-- Example 3: Border Color (Purple Border on a Button) -->
    <h3>3. Border Color</h3>
    <button style="background-color: #FFFFFF; border: 3px solid #8E44AD; color: #8E44AD; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px;">
        Purple Border Button (#8E44AD)
    </button>

</body>
</html>
