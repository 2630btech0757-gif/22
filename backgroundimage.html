
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image Example</title>
    <style>
        body {
            /* Replace 'your-image.jpg' with your actual image path or URL */
            background-image: url('your-image.jpg');
            
            /* Prevents the image from repeating like a tile */
            background-repeat: no-repeat;
            
            /* Scales the image to cover the entire screen */
            background-size: cover;
            
            /* Centers the image in the middle of the viewport */
            background-position: center;
            
            /* Ensures the body takes up the full viewport height */
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
</body>
</html>
</body>
