<!DOCTYPE html>
<html>
<head>
  <title>Font Weight and Style</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .normal-text { font-weight: normal; font-style: normal; }
    .bold-italic { font-weight: bold; font-style: italic; }
    .heavy-slant { font-weight: 800; font-style: oblique; }
  </style>
</head>
<body>
  <p class="normal-text">Regular weight and normal style.</p>
  <p class="bold-italic">Bold weight and italic style.</p>
  <p class="heavy-slant">Heavy weight (800) and oblique style.</p>
</body>
</html>
