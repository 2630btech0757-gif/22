<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Heading Color with Class</title>
    <style>
        /* Define the class to change text color */
        .highlight-red {
            color: rgb(251, 255, 0);
        }
    </style>
</head>
<body>

    <h1>First Heading (Default Color)</h1>
    
    <!-- Apply the class to change only this heading's color -->
    <h2 class="highlight-red">Second Heading (Red Color)</h2>
    
    <h3>Third Heading (Default Color)</h3>

</body>
</html>
