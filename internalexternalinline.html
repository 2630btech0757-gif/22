
<html>
<head>
    <title>All Three CSS Types</title>
    
    <!-- 1. EXTERNAL CSS: Connected via a link tag -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 2. INTERNAL CSS: Written inside the head section -->
    <style>
        h2 {
            color: green;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <!-- Styled by External CSS -->
    <h1>This is styled with External CSS</h1>
    
    <!-- Styled by Internal CSS -->
    <h2>This is styled with Internal CSS</h2>
    
    <!-- 3. INLINE CSS: Written directly inside the tag -->
    <p style="color: red; font-size: 18px;">This is styled with Inline CSS.</p>
</body>
</html>
